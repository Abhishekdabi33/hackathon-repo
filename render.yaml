services:
  # FastAPI Clinical Backend
  - type: web
    name: lablens-ai-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: "/docs"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: PYTHONPATH
        value: .
      - key: GEMINI_API_KEY
        sync: false
      - key: CLOUD_GPU_URL
        value: https://proxy-service-editor.ngrok-free.dev

  # React + Vite Frontend Static Site
  - type: static
    name: lablens-ai-frontend
    region: oregon
    plan: free
    buildCommand: "cd frontend && pnpm install && pnpm run build"
    staticPublishPath: "./frontend/dist"
    headers:
      - path: /*
        name: Access-Control-Allow-Origin
        value: "*"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: lablens-ai-backend
          property: host
