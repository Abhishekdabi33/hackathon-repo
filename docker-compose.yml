version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lablens-ai-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - CLOUD_GPU_URL=https://proxy-service-editor.ngrok-free.dev
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: lablens-ai-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
